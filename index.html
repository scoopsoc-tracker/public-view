return '<div class="c"><h2>Month-wise investments</h2><div class="t"><table><tr><th>Month</th><th class="r">Entries</th><th class="r">Invested</th><th class="r">Current value</th><th class="r">Gain</th><th class="r">Cumulative invested</th></tr>'+r+'<tr><th>Total</th><th></th><th class="r">'+F(tc)+'</th><th class="r">'+F(tv)+'</th><th class="r">'+F(tv-tc)+'</th><th></th></tr></table></div></div>'}
function cwise(){var cur=today().slice(0,7),ms=S.contribs.map(function(c){return c.month}).concat([cur]).sort(),a=ms[0],z=ms[ms.length-1],L=[],y=+a.slice(0,4),m=+a.slice(5,7);
for(;;){var k=y+'-'+(m<10?'0':'')+m;L.push(k);if(k>=z)break;m++;if(m>12){m=1;y++}}
var lb=function(k){try{return new Date(k+'-01').toLocaleString('en-IN',{month:'short',year:'2-digit'})}catch(e){return k}},col={},gt=0;
L.forEach(function(k){col[k]=0});
var rows=S.members.map(function(mb){var t=0,cells=L.map(function(k){var v=sum(S.contribs.filter(function(c){return c.m==mb.id&&c.month==k}),function(c){return c.amt});col[k]+=v;t+=v;
return '<td class="r '+(v<amtOf(mb)&&k<=cur?'bad':'')+'">'+(v?Math.round(v).toLocaleString('en-IN'):(k<=cur?'Due':'–'))+'</td>'}).join('');
gt+=t;var exp=amtOf(mb)*L.filter(function(k){return k<=cur}).length,pend=Math.max(0,exp-t);
return '<tr><td>'+esc(mb.name)+'</td>'+cells+'<td class="r"><b>'+F(t)+'</b></td><td class="r '+(pend?'bad':'ok')+'">'+(pend?F(pend):'✓')+'</td></tr>'}).join('');
return '<div class="c"><h2>Member-wise contributions</h2><div class="t"><table><tr><th>Member</th>'+L.map(function(k){return '<th class="r">'+lb(k)+'</th>'}).join('')+'<th class="r">Total</th><th class="r">Pending</th></tr>'+rows+'<tr><th>Total</th>'+L.map(function(k){return '<th class="r">'+Math.round(col[k]).toLocaleString('en-IN')+'</th>'}).join('')+'<th class="r">'+F(gt)+'</th><th></th></tr></table></div><p class="sub">Amounts in ₹. "Due" = no contribution recorded for a month that has started. Pending = each member’s monthly amount (set in the Members tab) × months elapsed, minus paid. Red amounts are short.</p></div>'}
function amtOf(m){return (m&&m.monthly)||S.monthly}
function setAmt(id,v){S.members.find(function(m){return m.id==id}).monthly=+v||0;save();draw(true)}
function pick(){var m=S.members.find(function(x){return x.id==$('cm').value});$('ca').value=amtOf(m)}
var uid=function(){return Date.now()+Math.floor(Math.random()*1e3)};
function ren(id,v){S.members.find(function(m){return m.id==id}).name=v||'Member '+id;save()}
function addC(){var a=+$('ca').value;if(!a)return;S.contribs.push({id:uid(),m:+$('cm').value,month:$('cmo').value,amt:a,date:today()});draw()}
function allC(){var mon=$('cmo').value,n=0;S.members.forEach(function(m){if(S.contribs.some(function(c){return c.m==m.id&&c.month==mon}))return;n++;S.contribs.push({id:uid(),m:m.id,month:mon,amt:amtOf(m),date:today()})});if(!n)say('Everyone already has an entry for this month.');draw()}
function addL(){var a=+$('la').value,p=+$('lp').value||5,n=+$('ln').value||20,m=+$('lm').value,r=+$('lr').value||0,d=$('ld').value||today();if(!a)return;var fin=function(){S.loans.push({id:uid(),m:m,amt:a,rate:r,pct:p,n:n,date:d,reps:[]});draw()};var step2=function(){if(a>T().cash)ask('Loan exceeds cash in hand. Continue?',fin);else fin()};if(p*n<100)ask('Principal % x tenure is below 100%, so the last installment will carry the balance. Continue?',step2);else step2()}
function delC(id){var c=S.contribs.find(function(x){return x.id==id});if(!c)return;ask('Remove this contribution?\n'+nm(c.m)+' · '+c.month+' · '+F(c.amt),function(){S.contribs=S.contribs.filter(function(x){return x.id!=id});draw()})}
function undoC(){var c=S.contribs[S.contribs.length-1];if(!c){say('No contributions to undo.');return}ask('Undo the last entry added?\n'+nm(c.m)+' · '+c.month+' · '+F(c.amt),function(){S.contribs.pop();draw()})}
function delMonth(){var mon=$('cmo').value,n=S.contribs.filter(function(c){return c.month==mon}).length;if(!n){say('No contributions recorded for '+mon+'.');return}ask('Remove all '+n+' contributions for '+mon+'?',function(){S.contribs=S.contribs.filter(function(c){return c.month!=mon});draw()})}
function ask(msg,ok){var o=document.createElement('div');o.className='ov';var b=document.createElement('div');b.className='dg';var p=document.createElement('p');p.textContent=msg;var r=document.createElement('div');r.className='dr';var close=function(){o.remove()};
if(ok){var c=document.createElement('button');c.textContent='Cancel';c.onclick=close;r.appendChild(c)}
var y=document.createElement('button');y.className='p';y.textContent=ok?'Confirm':'OK';y.onclick=function(){close();if(ok)ok()};r.appendChild(y);b.appendChild(p);b.appendChild(r);o.appendChild(b);document.body.appendChild(o)}
function say(m){ask(m)}
var openL={};
function tg(id){openL[id]=!openL[id];draw(true)}
function fore(id){var l=S.loans.find(function(x){return x.id==id}),lock=addM(l.date,2);if(today()<lock){say('Foreclosure is not allowed in the first 2 months. Earliest date: '+lock);return}var s=sched(l);ask('Foreclose by paying '+F(s.fore)+'?',function(){l.reps.push({amt:s.fore,date:today()});l.closed=true;draw()})}
function rep(id){var a=+$('rp'+id).value;if(!a)return;S.loans.find(function(l){return l.id==id}).reps.push({amt:a,date:today()});draw()}
function addI(){var a=+$('ic').value,nmv=$('in').value,ty=$('it').value,d=$('id').value||today();if(!a||!nmv)return;var fin=function(){S.invs.push({id:uid(),name:nmv,type:ty,cost:a,value:a,date:d});draw()};if(a>T().cash)ask('Amount exceeds cash in hand. Continue?',fin);else fin()}
function upv(id,v){S.invs.find(function(i){return i.id==id}).value=+v||0;draw()}
function del(k,id){ask('Delete this entry?',function(){S[k]=S[k].filter(function(x){return x.id!=id});draw()})}
async function exp(){var txt=JSON.stringify(S,null,2);try{var d=await window.claude.use('downloads');if(d){await d.save({filename:'society-backup.json',data:new Blob([txt],{type:'application/json'})});return}}catch(e){if(e&&e.code=='declined')return}var a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(txt);a.download='society-backup.json';a.click()}
function imp(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(d.members){S=d;draw()}}catch(e){say('Invalid file')}};r.readAsText(f)}
draw();
</script>
